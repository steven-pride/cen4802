apiVersion: v1
kind: Service
metadata:
  name: fibonacci-app
  labels:
    app: fibonacci-app
spec:
  type: NodePort
  selector:
    app: fibonacci-app
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      nodePort: 31693
    - name: jmx
      port: 9010
      targetPort: 9010
      nodePort: 30910